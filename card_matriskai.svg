<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Space+Mono:wght@400;700&amp;display=swap');
      
      .bg { fill: #0b0e14; stroke: rgba(0, 240, 255, 0.2); stroke-width: 1.5; rx: 6px; }
      .text-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .text-sub { font-family: 'Space Mono', monospace; font-size: 9px; fill: #8b949e; letter-spacing: 1.5px; }
      .text-tag { font-family: 'Space Mono', monospace; font-size: 9px; fill: #00f0ff; }
      .tag-bg { fill: rgba(0, 240, 255, 0.08); stroke: rgba(0, 240, 255, 0.2); stroke-width: 1; rx: 3px; }
      .grid-lines { stroke: rgba(255, 255, 255, 0.02); stroke-width: 1; }
      
      /* Trendline styling */
      .trendpath { stroke: #00f0ff; stroke-width: 2; fill: none; filter: url(#glow-cyan); }
      .trendpath-dash { stroke: rgba(255, 0, 127, 0.6); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
      .anomaly-point { fill: #ff007f; filter: url(#glow-pink); }
      
      /* Animations */
      .scan {
        animation: grid-scan 4s infinite ease-in-out;
      }
      .wave-flow {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: draw-wave 4s infinite linear;
      }
      .blink {
        animation: alert-blink 1.2s infinite step-end;
      }
      .node-pulse {
        animation: pulse-node 2.2s infinite ease-in-out;
      }

      @keyframes grid-scan {
        0%, 100% { transform: translateY(0); opacity: 0.1; }
        50% { transform: translateY(180px); opacity: 0.5; }
      }
      @keyframes draw-wave {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes alert-blink {
        50% { opacity: 0.2; fill: #ff007f; }
      }
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.5; }
      }
    </style>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="380" height="180" class="bg" />

  <!-- Technical Grid Overlay -->
  <g>
    <line x1="30" y1="0" x2="30" y2="180" class="grid-lines" />
    <line x1="60" y1="0" x2="60" y2="180" class="grid-lines" />
    <line x1="90" y1="0" x2="90" y2="180" class="grid-lines" />
    <line x1="120" y1="0" x2="120" y2="180" class="grid-lines" />
    <line x1="150" y1="0" x2="150" y2="180" class="grid-lines" />
    
    <line x1="0" y1="30" x2="380" y2="30" class="grid-lines" />
    <line x1="0" y1="60" x2="380" y2="60" class="grid-lines" />
    <line x1="0" y1="90" x2="380" y2="90" class="grid-lines" />
    <line x1="0" y1="120" x2="380" y2="120" class="grid-lines" />
    <line x1="0" y1="150" x2="380" y2="150" class="grid-lines" />
  </g>

  <!-- Animated Scanner -->
  <line x1="0" y1="0" x2="380" y2="0" stroke="#00f0ff" stroke-width="1" class="scan" />

  <!-- Risk Plot Diagram (Left side) -->
  <g transform="translate(15, 40)">
    <!-- Axes -->
    <line x1="10" y1="10" x2="10" y2="110" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
    <line x1="10" y1="110" x2="110" y2="110" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
    
    <!-- Dotted Grid lines inside chart -->
    <line x1="10" y1="35" x2="110" y2="35" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="10" y1="60" x2="110" y2="60" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="10" y1="85" x2="110" y2="85" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Wave Plot (Normal Trend) -->
    <!-- path data represents smooth Bezier curve -->
    <path d="M 10,95 Q 30,30 50,80 T 90,40 T 110,65" class="trendpath wave-flow" />

    <!-- Wave Plot Forecast (Dashed extension) -->
    <path d="M 110,65 Q 120,80 130,55" class="trendpath-dash" />

    <!-- Anomaly Point & Ring (Flashes) -->
    <g transform="translate(90, 40)">
      <circle cx="0" cy="0" r="4" class="anomaly-point blink" />
      <circle cx="0" cy="0" r="8" stroke="#ff007f" stroke-width="1" fill="none" class="node-pulse" />
    </g>

    <!-- UI indicators inside chart -->
    <text x="75" y="25" font-family="Space Mono, monospace" font-size="7" fill="#ff007f" class="blink">! RISK_ALERT</text>
  </g>

  <!-- Project Details (Right side) -->
  <g transform="translate(145, 35)">
    <text x="0" y="15" class="text-title">MatriskAI</text>
    <text x="0" y="32" class="text-sub">RISK INTELLIGENCE PIPELINE</text>
    
    <!-- Code diagnostic detail -->
    <g transform="translate(0, 48)" font-family="Space Mono, monospace" font-size="8" fill="#586069">
      <text x="0" y="10">&gt; RISK_INDEX: <tspan fill="#ff007f">CRITICAL_WARNING</tspan></text>
      <text x="0" y="22">&gt; AUDITABILITY: SHAP_LOGS_OK</text>
      <text x="0" y="34">&gt; MODEL_INDEX: XGBOOST + PROPHET</text>
    </g>

    <!-- Tech Tags Grid -->
    <g transform="translate(0, 95)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="55" height="18" class="tag-bg" />
      <text x="27.5" y="12" class="text-tag" text-anchor="middle">XGBOOST</text>
      
      <!-- Tag 2 -->
      <rect x="61" y="0" width="55" height="18" class="tag-bg" />
      <text x="88.5" y="12" class="text-tag" text-anchor="middle">PROPHET</text>
      
      <!-- Tag 3 -->
      <rect x="122" y="0" width="40" height="18" class="tag-bg" />
      <text x="142" y="12" class="text-tag" text-anchor="middle">SHAP</text>
      
      <!-- Tag 4 -->
      <rect x="168" y="0" width="48" height="18" class="tag-bg" />
      <text x="192" y="12" class="text-tag" text-anchor="middle">DOCKER</text>
    </g>
  </g>

  <!-- Design corner brackets -->
  <path d="M 8,15 L 8,8 L 15,8" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 372,15 L 372,8 L 365,8" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 8,165 L 8,172 L 15,172" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 372,165 L 372,172 L 365,172" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" fill="none" />
</svg>
