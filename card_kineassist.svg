<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Space+Mono:wght@400;700&amp;display=swap');
      
      .bg { fill: #0b0e14; stroke: rgba(63, 185, 80, 0.2); stroke-width: 1.5; rx: 6px; }
      .text-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .text-sub { font-family: 'Space Mono', monospace; font-size: 9px; fill: #8b949e; letter-spacing: 1.5px; }
      .text-tag { font-family: 'Space Mono', monospace; font-size: 9px; fill: #3fb950; }
      .tag-bg { fill: rgba(63, 185, 80, 0.08); stroke: rgba(63, 185, 80, 0.2); stroke-width: 1; rx: 3px; }
      .wireframe { stroke: rgba(63, 185, 80, 0.35); stroke-width: 1.5; fill: none; }
      .wireframe-joint { fill: #3fb950; filter: url(#glow-green); }
      .grid-lines { stroke: rgba(255, 255, 255, 0.02); stroke-width: 1; }
      
      /* Animations */
      .scan {
        animation: grid-scan 4s infinite ease-in-out;
      }
      .joint-pulse {
        animation: pulse-joint 1.5s infinite ease-in-out;
      }
      .target-box {
        stroke: #3fb950;
        stroke-width: 1.2;
        stroke-dasharray: 4 2;
        fill: none;
        animation: rotate-box 8s infinite linear;
        transform-origin: 65px 90px;
      }
      .blink {
        animation: blinker 1.8s infinite step-end;
      }

      @keyframes grid-scan {
        0%, 100% { transform: translateY(0); opacity: 0.1; }
        50% { transform: translateY(180px); opacity: 0.5; }
      }
      @keyframes pulse-joint {
        0%, 100% { r: 3; opacity: 1; }
        50% { r: 5; opacity: 0.5; }
      }
      @keyframes rotate-box {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blinker {
        50% { opacity: 0.3; }
      }
    </style>

    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="380" height="180" class="bg" />

  <!-- Technical Grid Overlay -->
  <g>
    <line x1="30" y1="0" x2="30" y2="180" class="grid-lines" />
    <line x1="60" y1="0" x2="60" y2="180" class="grid-lines" />
    <line x1="90" y1="0" x2="90" y2="180" class="grid-lines" />
    <line x1="120" y1="0" x2="120" y2="180" class="grid-lines" />
    <line x1="150" y1="0" x2="150" y2="180" class="grid-lines" />
    
    <line x1="0" y1="30" x2="380" y2="30" class="grid-lines" />
    <line x1="0" y1="60" x2="380" y2="60" class="grid-lines" />
    <line x1="0" y1="90" x2="380" y2="90" class="grid-lines" />
    <line x1="0" y1="120" x2="380" y2="120" class="grid-lines" />
    <line x1="0" y1="150" x2="380" y2="150" class="grid-lines" />
  </g>

  <!-- Animated Scanner -->
  <line x1="0" y1="0" x2="380" y2="0" stroke="#3fb950" stroke-width="1" class="scan" />

  <!-- HUD Pose skeleton (Left side) -->
  <g>
    <!-- Background radar target rings -->
    <circle cx="65" cy="90" r="45" stroke="rgba(63, 185, 80, 0.08)" stroke-width="1" fill="none" />
    <circle cx="65" cy="90" r="30" stroke="rgba(63, 185, 80, 0.12)" stroke-width="1" stroke-dasharray="3 3" fill="none" />
    <rect x="35" y="60" width="60" height="60" class="target-box" />

    <!-- Skeleton connections -->
    <!-- Torso/Spine -->
    <line x1="65" y1="60" x2="65" y2="105" class="wireframe" />
    <!-- Shoulders -->
    <line x1="50" y1="70" x2="80" y2="70" class="wireframe" />
    <!-- Left Arm -->
    <line x1="50" y1="70" x2="40" y2="90" class="wireframe" />
    <line x1="40" y1="90" x2="35" y2="110" class="wireframe" />
    <!-- Right Arm -->
    <line x1="80" y1="70" x2="90" y2="90" class="wireframe" />
    <line x1="90" y1="90" x2="95" y2="110" class="wireframe" />
    <!-- Hips -->
    <line x1="55" y1="105" x2="75" y2="105" class="wireframe" />
    <!-- Left Leg -->
    <line x1="55" y1="105" x2="50" y2="130" class="wireframe" />
    <line x1="50" y1="130" x2="48" y2="155" class="wireframe" />
    <!-- Right Leg -->
    <line x1="75" y1="105" x2="80" y2="130" class="wireframe" />
    <line x1="80" y1="130" x2="82" y2="155" class="wireframe" />

    <!-- Joint Nodes -->
    <circle cx="65" cy="60" r="3" class="wireframe-joint joint-pulse" /> <!-- Head -->
    <circle cx="65" cy="70" r="2.5" class="wireframe-joint" /> <!-- Neck -->
    <circle cx="50" cy="70" r="2.5" class="wireframe-joint" /> <!-- L shoulder -->
    <circle cx="80" cy="70" r="2.5" class="wireframe-joint" /> <!-- R shoulder -->
    <circle cx="40" cy="90" r="2.5" class="wireframe-joint" /> <!-- L elbow -->
    <circle cx="90" cy="90" r="2.5" class="wireframe-joint" /> <!-- R elbow -->
    <circle cx="35" cy="110" r="2.5" class="wireframe-joint joint-pulse" /> <!-- L wrist -->
    <circle cx="95" cy="110" r="2.5" class="wireframe-joint joint-pulse" /> <!-- R wrist -->
    <circle cx="55" cy="105" r="2.5" class="wireframe-joint" /> <!-- L hip -->
    <circle cx="75" cy="105" r="2.5" class="wireframe-joint" /> <!-- R hip -->
    <circle cx="50" cy="130" r="2.5" class="wireframe-joint" /> <!-- L knee -->
    <circle cx="80" cy="130" r="2.5" class="wireframe-joint" /> <!-- R knee -->
    <circle cx="48" cy="155" r="2.5" class="wireframe-joint joint-pulse" /> <!-- L ankle -->
    <circle cx="82" cy="155" r="2.5" class="wireframe-joint joint-pulse" /> <!-- R ankle -->
  </g>

  <!-- Project Details (Right side) -->
  <g transform="translate(140, 35)">
    <text x="0" y="15" class="text-title">KineAssist</text>
    <text x="0" y="32" class="text-sub">AI-ASSISTED PHYSIOTHERAPY</text>
    
    <!-- Code diagnostic detail -->
    <g transform="translate(0, 48)" font-family="Space Mono, monospace" font-size="8" fill="#586069">
      <text x="0" y="10">&gt; POSE_DETECTION: <tspan fill="#3fb950" class="blink">MEDIAPIPE_OK</tspan></text>
      <text x="0" y="22">&gt; FEEDBACK_LOOP: VOICE_ASSIST_ON</text>
      <text x="0" y="34">&gt; STABILITY_INDEX: 94.2%</text>
    </g>

    <!-- Tech Tags Grid -->
    <g transform="translate(0, 95)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="62" height="18" class="tag-bg" />
      <text x="31" y="12" class="text-tag" text-anchor="middle">MEDIAPIPE</text>
      
      <!-- Tag 2 -->
      <rect x="68" y="0" width="62" height="18" class="tag-bg" />
      <text x="99" y="12" class="text-tag" text-anchor="middle">STREAMLIT</text>
      
      <!-- Tag 3 -->
      <rect x="136" y="0" width="48" height="18" class="tag-bg" />
      <text x="160" y="12" class="text-tag" text-anchor="middle">PYTHON</text>
    </g>
  </g>

  <!-- Design corner brackets -->
  <path d="M 8,15 L 8,8 L 15,8" stroke="rgba(63, 185, 80, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 372,15 L 372,8 L 365,8" stroke="rgba(63, 185, 80, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 8,165 L 8,172 L 15,172" stroke="rgba(63, 185, 80, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 372,165 L 372,172 L 365,172" stroke="rgba(63, 185, 80, 0.4)" stroke-width="1.5" fill="none" />
</svg>
