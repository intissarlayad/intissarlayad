<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Neon Glow Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulse-opacity {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }
    @keyframes pulse-status {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    @keyframes float-grid {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes sweep-line {
      0% { transform: translateX(0); opacity: 0.1; }
      50% { opacity: 0.6; }
      100% { transform: translateX(790px); opacity: 0.1; }
    }
    @keyframes glow-shift {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.8)); }
    }
    @keyframes text-fade {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    /* Styles */
    .bg-main { fill: #06090f; stroke: #00f0ff; stroke-width: 1.5; }
    .border-glow { animation: glow-shift 5s infinite ease-in-out; }
    
    .font-mono { font-family: 'Space Mono', 'Fira Code', monospace; font-size: 13px; fill: #8b949e; }
    .font-sans { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: bold; }
    
    .logo-bracket { fill: #3fb950; font-weight: bold; }
    .logo-text { fill: #f0f6fc; font-weight: bold; letter-spacing: 1px; }
    
    .status-text { fill: #3fb950; font-weight: bold; font-size: 11px; }
    .status-dot { fill: #3fb950; transform-origin: center; animation: pulse-status 2s infinite ease-in-out; }
    .status-border { fill: none; stroke: rgba(63, 185, 80, 0.3); stroke-width: 1; }

    .title-main { font-size: 38px; fill: #f0f6fc; letter-spacing: 2px; }
    .subtitle-main { font-size: 14px; fill: #00f0ff; letter-spacing: 3px; font-weight: 500; }
    .tagline { font-size: 12px; fill: #ff007f; letter-spacing: 1px; font-weight: normal; }

    .network-node { transform-origin: center; animation: pulse-opacity 4s infinite ease-in-out; }
    .grid-bg { stroke: rgba(0, 240, 255, 0.03); stroke-width: 1; }
    .scan-bar { stroke: #00f0ff; stroke-width: 1.5; opacity: 0.4; filter: url(#glow-cyan); animation: sweep-line 8s infinite linear; }
  </style>

  <!-- Base Card Frame -->
  <rect x="5" y="5" width="790" height="190" rx="8" ry="8" class="bg-main border-glow" />

  <!-- Cyber Grid Background -->
  <g class="grid-bg" style="animation: float-grid 6s infinite ease-in-out;">
    <line x1="5" y1="40" x2="795" y2="40" />
    <line x1="5" y1="80" x2="795" y2="80" />
    <line x1="5" y1="120" x2="795" y2="120" />
    <line x1="5" y1="160" x2="795" y2="160" />
    
    <line x1="100" y1="5" x2="100" y2="195" />
    <line x1="200" y1="5" x2="200" y2="195" />
    <line x1="300" y1="5" x2="300" y2="195" />
    <line x1="400" y1="5" x2="400" y2="195" />
    <line x1="500" y1="5" x2="500" y2="195" />
    <line x1="600" y1="5" x2="600" y2="195" />
    <line x1="700" y1="5" x2="700" y2="195" />
  </g>

  <!-- Sweeping Laser Scan Line -->
  <line x1="5" y1="5" x2="5" y2="195" class="scan-bar" />

  <!-- Header / Navigation Bar simulation -->
  <!-- Logo: [ INTISSAR_LAYAD ] -->
  <g transform="translate(25, 30)">
    <text class="font-mono" y="0">
      <tspan class="logo-bracket">[</tspan>
      <tspan class="logo-text">INTISSAR_LAYAD</tspan>
      <tspan class="logo-bracket">]</tspan>
    </text>
  </g>

  <!-- System Status Capsule -->
  <g transform="translate(620, 15)">
    <rect x="0" y="0" width="150" height="22" rx="11" ry="11" class="status-border" />
    <circle cx="15" cy="11" r="4" class="status-dot" filter="url(#glow-green)" />
    <text x="28" y="15" class="font-mono status-text">SYS_STATUS: ACTIVE</text>
  </g>

  <!-- Central Web Application Title block -->
  <g transform="translate(400, 110)" text-anchor="middle" style="animation: text-fade 4s infinite ease-in-out;">
    <!-- Large Glowing Title -->
    <text class="font-sans title-main" y="0" filter="url(#glow-cyan)">INTISSAR LAYAD</text>
    <text class="font-sans title-main" y="0">INTISSAR LAYAD</text>
    
    <!-- Subtitles -->
    <text class="font-sans subtitle-main" y="28">AI &amp; DATA SCIENCE // ENGINEERING STUDENT</text>
    <text class="font-mono tagline" y="48">SECURE_NODE // ESTABLISHED_CONNECTION</text>
  </g>

  <!-- Abstract Pulsing Geometric Grid (Neural Net Style) on Left/Right for depth -->
  <!-- Left Side Network -->
  <g transform="translate(75, 120)" class="network-node">
    <line x1="0" y1="-30" x2="-20" y2="10" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <line x1="0" y1="-30" x2="25" y2="-10" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <line x1="-20" y1="10" x2="25" y2="-10" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <line x1="-20" y1="10" x2="0" y2="40" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <line x1="25" y1="-10" x2="0" y2="40" stroke="rgba(0,240,255,0.2)" stroke-width="1" />

    <circle cx="0" cy="-30" r="4.5" fill="#00f0ff" filter="url(#glow-cyan)" />
    <circle cx="-20" cy="10" r="3.5" fill="#3fb950" />
    <circle cx="25" cy="-10" r="4" fill="#ff007f" filter="url(#glow-pink)" />
    <circle cx="0" cy="40" r="3" fill="#00f0ff" />
  </g>

  <!-- Right Side Network -->
  <g transform="translate(720, 120)" class="network-node" style="animation-delay: -2s;">
    <line x1="0" y1="-25" x2="-25" y2="15" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <line x1="0" y1="-25" x2="20" y2="0" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <line x1="-25" y1="15" x2="20" y2="0" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <line x1="-25" y1="15" x2="-5" y2="45" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <line x1="20" y1="0" x2="-5" y2="45" stroke="rgba(0,240,255,0.2)" stroke-width="1" />

    <circle cx="0" cy="-25" r="3.5" fill="#3fb950" />
    <circle cx="-25" cy="15" r="4.5" fill="#ff007f" filter="url(#glow-pink)" />
    <circle cx="20" cy="0" r="4.5" fill="#00f0ff" filter="url(#glow-cyan)" />
    <circle cx="-5" cy="45" r="3" fill="#3fb950" />
  </g>

</svg>
