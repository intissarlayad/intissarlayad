<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Space+Mono:wght@400;700&amp;display=swap');
      
      .bg { fill: #0b0e14; stroke: rgba(255, 0, 127, 0.2); stroke-width: 1.5; rx: 6px; }
      .text-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .text-sub { font-family: 'Space Mono', monospace; font-size: 9px; fill: #8b949e; letter-spacing: 1.5px; }
      .text-tag { font-family: 'Space Mono', monospace; font-size: 9px; fill: #ff007f; }
      .tag-bg { fill: rgba(255, 0, 127, 0.08); stroke: rgba(255, 0, 127, 0.2); stroke-width: 1; rx: 3px; }
      .grid-lines { stroke: rgba(255, 255, 255, 0.02); stroke-width: 1; }
      
      /* Network diagram */
      .network-line { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; fill: none; }
      .network-flow-pink { stroke: #ff007f; stroke-width: 1.5; fill: none; stroke-dasharray: 6 6; animation: dash 12s infinite linear; filter: url(#glow-pink); }
      .network-flow-cyan { stroke: #00f0ff; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; animation: dash 8s infinite linear; }
      .node-pink { fill: #ff007f; filter: url(#glow-pink); }
      .node-cyan { fill: #00f0ff; }
      
      /* Animations */
      .scan {
        animation: grid-scan 4s infinite ease-in-out;
      }
      .node-pulse {
        animation: pulse-node 2s infinite ease-in-out;
      }
      .blink {
        animation: blinker 1.5s infinite step-end;
      }

      @keyframes grid-scan {
        0%, 100% { transform: translateY(0); opacity: 0.1; }
        50% { transform: translateY(180px); opacity: 0.5; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes pulse-node {
        0%, 100% { r: 3.5; opacity: 1; }
        50% { r: 5.5; opacity: 0.6; }
      }
      @keyframes blinker {
        50% { opacity: 0.3; }
      }
    </style>

    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="380" height="180" class="bg" />

  <!-- Technical Grid Overlay -->
  <g>
    <line x1="30" y1="0" x2="30" y2="180" class="grid-lines" />
    <line x1="60" y1="0" x2="60" y2="180" class="grid-lines" />
    <line x1="90" y1="0" x2="90" y2="180" class="grid-lines" />
    <line x1="120" y1="0" x2="120" y2="180" class="grid-lines" />
    <line x1="150" y1="0" x2="150" y2="180" class="grid-lines" />
    
    <line x1="0" y1="30" x2="380" y2="30" class="grid-lines" />
    <line x1="0" y1="60" x2="380" y2="60" class="grid-lines" />
    <line x1="0" y1="90" x2="380" y2="90" class="grid-lines" />
    <line x1="0" y1="120" x2="380" y2="120" class="grid-lines" />
    <line x1="0" y1="150" x2="380" y2="150" class="grid-lines" />
  </g>

  <!-- Animated Scanner -->
  <line x1="0" y1="0" x2="380" y2="0" stroke="#ff007f" stroke-width="1" class="scan" />

  <!-- Vector Mapping Diagram (Left side) -->
  <g transform="translate(10, 30)">
    <!-- Custom graphic shapes representing image input and ChromaDB vectors -->
    <!-- Image Box Frame -->
    <rect x="15" y="25" width="30" height="25" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
    <polygon points="20,45 28,35 34,41 40,32 45,45" fill="none" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1" />
    <circle cx="38" cy="32" r="2" fill="#ff007f" />
    
    <!-- Vector Database Grid representation -->
    <g transform="translate(85, 20)">
      <rect x="0" y="0" width="30" height="35" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
      <line x1="10" y1="0" x2="10" y2="35" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="1 1" />
      <line x1="20" y1="0" x2="20" y2="35" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="1 1" />
      <line x1="0" y1="12" x2="30" y2="12" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="1 1" />
      <line x1="0" y1="24" x2="30" y2="24" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="1 1" />
      
      <!-- Activated Vector cell -->
      <rect x="10" y="12" width="10" height="12" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1" />
    </g>

    <!-- Language Synthesis Text box -->
    <g transform="translate(45, 85)">
      <rect x="0" y="0" width="45" height="20" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
      <line x1="5" y1="6" x2="40" y2="6" stroke="#ff007f" stroke-width="1" />
      <line x1="5" y1="10" x2="30" y2="10" stroke="#00f0ff" stroke-width="1" />
      <line x1="5" y1="14" x2="35" y2="14" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    </g>

    <!-- Connector flow pathways -->
    <path d="M 45,37 L 85,32" class="network-flow-pink" />
    <path d="M 100,55 L 70,85" class="network-flow-cyan" />
    <path d="M 30,50 L 45,95" class="network-line" />

    <!-- Node Points -->
    <circle cx="45" cy="37" r="4" class="node-pink node-pulse" />
    <circle cx="85" cy="32" r="3" class="node-cyan" />
    <circle cx="100" cy="32" r="3.5" class="node-pink node-pulse" />
    <circle cx="70" cy="85" r="3" class="node-cyan" />
  </g>

  <!-- Project Details (Right side) -->
  <g transform="translate(145, 35)">
    <text x="0" y="15" class="text-title">Visual RAG</text>
    <text x="0" y="32" class="text-sub">MULTIMODAL LANDMARKS RAG</text>
    
    <!-- Code diagnostic detail -->
    <g transform="translate(0, 48)" font-family="Space Mono, monospace" font-size="8" fill="#586069">
      <text x="0" y="10">&gt; SEARCH_INDEX: <tspan fill="#ff007f" class="blink">CHROMADB_ACTIVE</tspan></text>
      <text x="0" y="22">&gt; DUAL_ENCODER: CLIP_MULTIMODAL</text>
      <text x="0" y="34">&gt; PIPELINE: RETRIEVAL_AUGMENTED</text>
    </g>

    <!-- Tech Tags Grid -->
    <g transform="translate(0, 95)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="34" height="18" class="tag-bg" />
      <text x="17" y="12" class="text-tag" text-anchor="middle">CLIP</text>
      
      <!-- Tag 2 -->
      <rect x="40" y="0" width="60" height="18" class="tag-bg" />
      <text x="70" y="12" class="text-tag" text-anchor="middle">CHROMADB</text>
      
      <!-- Tag 3 -->
      <rect x="106" y="0" width="34" height="18" class="tag-bg" />
      <text x="123" y="12" class="text-tag" text-anchor="middle">RAG</text>
      
      <!-- Tag 4 -->
      <rect x="146" y="0" width="38" height="18" class="tag-bg" />
      <text x="165" y="12" class="text-tag" text-anchor="middle">LLMS</text>
    </g>
  </g>

  <!-- Design corner brackets -->
  <path d="M 8,15 L 8,8 L 15,8" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 372,15 L 372,8 L 365,8" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 8,165 L 8,172 L 15,172" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1.5" fill="none" />
  <path d="M 372,165 L 372,172 L 365,172" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1.5" fill="none" />
</svg>
