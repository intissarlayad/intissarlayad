<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Import Google Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Space+Mono:wght@400;700&amp;display=swap');
      
      /* Base Classes */
      .bg { fill: #06090f; }
      .grid { stroke: rgba(63, 185, 80, 0.06); stroke-width: 1; }
      .grid-accent { stroke: rgba(0, 240, 255, 0.08); stroke-width: 1.5; }
      .text-title { font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; fill: #ffffff; }
      .text-title-glow { font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; fill: #3fb950; filter: url(#glow-green-text); opacity: 0.8; }
      .text-sub { font-family: 'Space Mono', monospace; font-size: 14px; fill: #8b949e; letter-spacing: 3px; }
      .text-sub-green { font-family: 'Space Mono', monospace; font-size: 14px; fill: #3fb950; letter-spacing: 3px; }
      .text-code { font-family: 'Space Mono', monospace; font-size: 11px; fill: #586069; }
      
      /* Animated Elements */
      .scan-line {
        stroke: #00f0ff;
        stroke-width: 1.5;
        opacity: 0.4;
        filter: url(#glow-cyan);
        animation: scan 6s infinite linear;
      }
      .hud-circle {
        transform-origin: 660px 120px;
        animation: rotate-clockwise 20s infinite linear;
      }
      .hud-circle-counter {
        transform-origin: 660px 120px;
        animation: rotate-counter 12s infinite linear;
      }
      .pulse-node {
        animation: pulse 2s infinite ease-in-out;
      }
      .pulse-node-cyan {
        animation: pulse-cyan 2s infinite ease-in-out;
      }
      .pulse-fast {
        animation: blink 1.5s infinite step-end;
      }
      .signal-flow {
        stroke-dasharray: 8, 8;
        animation: dash 30s infinite linear;
      }

      /* Animations Definitions */
      @keyframes scan {
        0% { transform: translateY(0); }
        50% { transform: translateY(240px); }
        100% { transform: translateY(0); }
      }
      @keyframes rotate-clockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotate-counter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulse {
        0%, 100% { r: 5; fill-opacity: 1; filter: drop-shadow(0 0 3px #3fb950); }
        50% { r: 8; fill-opacity: 0.5; filter: drop-shadow(0 0 8px #3fb950); }
      }
      @keyframes pulse-cyan {
        0%, 100% { r: 4; fill-opacity: 0.9; filter: drop-shadow(0 0 2px #00f0ff); }
        50% { r: 7; fill-opacity: 0.4; filter: drop-shadow(0 0 7px #00f0ff); }
      }
      @keyframes blink {
        50% { opacity: 0.3; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>

    <!-- Filters for Glowing Effects -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green-text" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="240" class="bg" />

  <!-- Cyber Grid Lines -->
  <g>
    <!-- Vertical Grid -->
    <line x1="40" y1="0" x2="40" y2="240" class="grid" />
    <line x1="80" y1="0" x2="80" y2="240" class="grid" />
    <line x1="120" y1="0" x2="120" y2="240" class="grid" />
    <line x1="160" y1="0" x2="160" y2="240" class="grid" />
    <line x1="200" y1="0" x2="200" y2="240" class="grid" />
    <line x1="240" y1="0" x2="240" y2="240" class="grid" />
    <line x1="280" y1="0" x2="280" y2="240" class="grid" />
    <line x1="320" y1="0" x2="320" y2="240" class="grid" />
    <line x1="360" y1="0" x2="360" y2="240" class="grid" />
    <line x1="400" y1="0" x2="400" y2="240" class="grid" />
    <line x1="440" y1="0" x2="440" y2="240" class="grid" />
    <line x1="480" y1="0" x2="480" y2="240" class="grid" />
    <line x1="520" y1="0" x2="520" y2="240" class="grid" />
    <line x1="560" y1="0" x2="560" y2="240" class="grid" />
    <line x1="600" y1="0" x2="600" y2="240" class="grid" />
    <line x1="640" y1="0" x2="640" y2="240" class="grid" />
    <line x1="680" y1="0" x2="680" y2="240" class="grid" />
    <line x1="720" y1="0" x2="720" y2="240" class="grid" />
    <line x1="760" y1="0" x2="760" y2="240" class="grid" />
    
    <!-- Horizontal Grid -->
    <line x1="0" y1="40" x2="800" y2="40" class="grid" />
    <line x1="0" y1="80" x2="800" y2="80" class="grid" />
    <line x1="0" y1="120" x2="800" y2="120" class="grid" />
    <line x1="0" y1="160" x2="800" y2="160" class="grid" />
    <line x1="0" y1="200" x2="800" y2="200" class="grid" />

    <!-- Grid Accent Borders -->
    <line x1="0" y1="0" x2="800" y2="0" class="grid-accent" />
    <line x1="0" y1="240" x2="800" y2="240" class="grid-accent" />
  </g>

  <!-- Animated Laser Sweep -->
  <line x1="0" y1="0" x2="800" y2="0" class="scan-line" />

  <!-- Decorative HUD Terminal Code -->
  <g opacity="0.35">
    <text x="25" y="30" class="text-code">SYSTEM_INIT: SECURE_PROTOCOL_v2.0.26</text>
    <text x="25" y="215" class="text-code">COGNITIVE_NODE: ENSAM_MEKNES // PORT: 443</text>
    <text x="25" y="230" class="text-code">ENCRYPTION: AES_256 // LOCAL_FIRST: ENABLED</text>
  </g>

  <!-- Holographic Neural Net / Tech Visuals (Left-Mid) -->
  <g>
    <!-- Connector Lines -->
    <line x1="480" y1="80" x2="540" y2="60" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" class="signal-flow" />
    <line x1="480" y1="80" x2="520" y2="140" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" class="signal-flow" />
    <line x1="540" y1="60" x2="590" y2="100" stroke="rgba(63, 185, 80, 0.25)" stroke-width="1.5" class="signal-flow" />
    <line x1="520" y1="140" x2="590" y2="100" stroke="rgba(63, 185, 80, 0.25)" stroke-width="1.5" class="signal-flow" />
    <line x1="590" y1="100" x2="630" y2="150" stroke="rgba(255, 0, 127, 0.25)" stroke-width="1.5" class="signal-flow" />

    <!-- Glowing Nodes -->
    <circle cx="480" cy="80" r="5" fill="#00f0ff" class="pulse-node-cyan" />
    <circle cx="540" cy="60" r="5" fill="#3fb950" class="pulse-node" />
    <circle cx="520" cy="140" r="4" fill="#00f0ff" class="pulse-node-cyan" />
    <circle cx="590" cy="100" r="5" fill="#3fb950" class="pulse-node" />
    <circle cx="630" cy="150" r="4" fill="#ff007f" class="pulse-node-cyan" style="animation-name: pulse;" />
  </g>

  <!-- Futuristic HUD Circle Radar (Far Right) -->
  <g opacity="0.75">
    <!-- Outer dashed circle rotating -->
    <circle cx="680" cy="110" r="65" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" fill="none" stroke-dasharray="10 12" class="hud-circle" />
    <!-- Inner segmented circle rotating counter -->
    <circle cx="680" cy="110" r="50" stroke="rgba(63, 185, 80, 0.4)" stroke-width="2" fill="none" stroke-dasharray="80 30 10 30" class="hud-circle-counter" />
    <!-- Center Target Crosshair -->
    <line x1="680" y1="100" x2="680" y2="120" stroke="#00f0ff" stroke-width="1" />
    <line x1="670" y1="110" x2="690" y2="110" stroke="#00f0ff" stroke-width="1" />
    <circle cx="680" cy="110" r="6" stroke="#ff007f" stroke-width="1.5" fill="none" class="pulse-fast" />
  </g>

  <!-- Main Identity Text Layout (Centered Left) -->
  <g transform="translate(45, 75)">
    <!-- Tech border design tag -->
    <path d="M 0,-15 L 12,-15 L 12,30" stroke="#3fb950" stroke-width="3" fill="none" />
    
    <!-- Title Text with double glow effect -->
    <text x="25" y="20" class="text-title-glow">INTISSAR LAYAD</text>
    <text x="25" y="20" class="text-title">INTISSAR LAYAD</text>
    
    <!-- Subtitles and status -->
    <text x="25" y="52" class="text-sub">AI &amp; DATA SCIENCE ENGINEER</text>
    <text x="25" y="76" class="text-sub-green">&gt; STATUS: <tspan fill="#00f0ff" class="pulse-fast">ACTIVE_NODE</tspan></text>
  </g>

  <!-- Design corner brackets -->
  <path d="M 10,25 L 10,10 L 25,10" stroke="#00f0ff" stroke-width="2" fill="none" />
  <path d="M 790,25 L 790,10 L 775,10" stroke="#00f0ff" stroke-width="2" fill="none" />
  <path d="M 10,215 L 10,230 L 25,230" stroke="#00f0ff" stroke-width="2" fill="none" />
  <path d="M 790,215 L 790,230 L 775,230" stroke="#00f0ff" stroke-width="2" fill="none" />
</svg>
